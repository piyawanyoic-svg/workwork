<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Earth & Twinkling Stars — Speed Control</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; font-family:Arial,sans-serif; }
    #info {
      position:fixed; z-index:9999; top:14px; left:50%; transform:translateX(-50%);
      padding:10px 16px; border-radius:18px; color:#fff; background:rgba(0,0,0,.62);
      font-size:14px; text-align:center; pointer-events:none; white-space:nowrap;
    }
    #controls {
      position:fixed; z-index:9999; bottom:16px; left:50%; transform:translateX(-50%);
      display:flex; align-items:center; gap:10px; padding:10px 12px;
      border:1px solid rgba(255,255,255,.25); border-radius:18px;
      color:#fff; background:rgba(7,12,35,.82); backdrop-filter:blur(8px);
      box-sizing:border-box; max-width:calc(100% - 20px);
    }
    #controls button {
      min-width:46px; min-height:44px; border:0; border-radius:12px;
      font-size:24px; font-weight:bold; background:#fff; color:#111; cursor:pointer;
    }
    #speedBox { min-width:105px; text-align:center; font-size:14px; }
    #speedValue { display:block; font-size:17px; font-weight:bold; margin-bottom:5px; }
    #speedRange { width:120px; max-width:27vw; accent-color:#79d8ff; display:block; }
    @media (max-width:420px) { #controls { gap:7px; padding:8px; } #speedBox { min-width:95px; } #speedRange { width:100px; } }
  </style>
</head>
<body>
  <div id="info" aria-live="polite">🌍 ส่องกล้องไปที่ Hiro Marker</div>

  <div id="controls" aria-label="ควบคุมความเร็วแอนิเมชัน">
    <button id="slowBtn" type="button" aria-label="ลดความเร็ว">−</button>
    <div id="speedBox">
      <span id="speedValue">ความเร็ว 1.0x</span>
      <input id="speedRange" type="range" min="0" max="5" step="0.25" value="1" aria-label="ปรับความเร็ว">
    </div>
    <button id="fastBtn" type="button" aria-label="เพิ่มความเร็ว">+</button>
  </div>

  <a-scene embedded vr-mode-ui="enabled:false"
    renderer="antialias:true; alpha:true"
    arjs="sourceType:webcam; debugUIEnabled:false;">
    <a-entity light="type:ambient; color:#ffffff; intensity:1.4"></a-entity>
    <a-entity light="type:directional; color:#ffffff; intensity:1.8" position="-2 3 4"></a-entity>

    <a-marker preset="hiro" id="hiroMarker">
      <a-entity id="space" position="0 0.4 0">
        <a-entity id="earth">
          <a-sphere radius="0.75" segments-width="48" segments-height="32"
            material="color:#247cff; roughness:0.7; metalness:0.05;"></a-sphere>
          <a-sphere radius="0.79"
            material="color:#58b9ff; opacity:0.16; transparent:true; side:double;"></a-sphere>
          <a-ring radius-inner="0.765" radius-outer="0.77" rotation="90 0 0"
            material="color:#8ed8ff; opacity:0.35; transparent:true;"></a-ring>
          <a-sphere radius="0.025" position="0.48 0.25 0.52" material="color:#fff59d; emissive:#fff59d;"></a-sphere>
          <a-sphere radius="0.02" position="-0.35 0.38 0.58" material="color:#fff59d; emissive:#fff59d;"></a-sphere>
          <a-sphere radius="0.018" position="0.15 -0.15 0.72" material="color:#fff59d; emissive:#fff59d;"></a-sphere>
        </a-entity>

        <a-torus radius="1.25" radius-tubular="0.008" rotation="70 0 15"
          material="color:#ffffff; opacity:0.25; transparent:true;"></a-torus>
        <a-torus radius="1.5" radius-tubular="0.006" rotation="105 25 0"
          material="color:#8bdcff; opacity:0.18; transparent:true;"></a-torus>

        <a-entity id="starsInner">
          <a-entity class="star" position="1.15 0.15 0"><a-text value="✦" align="center" color="#ffffff" width="0.7"></a-text></a-entity>
          <a-entity class="star" position="-1.05 0.4 0.1"><a-text value="✧" align="center" color="#fff6a8" width="0.8"></a-text></a-entity>
          <a-entity class="star" position="0.25 1.15 0.1"><a-text value="✦" align="center" color="#ffffff" width="0.75"></a-text></a-entity>
          <a-entity class="star" position="-0.4 -0.95 0.2"><a-text value="✧" align="center" color="#aee8ff" width="0.65"></a-text></a-entity>
          <a-entity class="star" position="0.85 -0.65 0.1"><a-text value="✦" align="center" color="#ffe88a" width="0.7"></a-text></a-entity>
        </a-entity>

        <a-entity id="starsOuter">
          <a-entity class="starBig" position="1.65 0.45 0"><a-text value="✦" align="center" color="#ffffff" width="0.9"></a-text></a-entity>
          <a-entity class="starBig" position="-1.55 0.7 0"><a-text value="✦" align="center" color="#fff8c2" width="0.8"></a-text></a-entity>
          <a-entity class="starBig" position="0.4 1.65 0"><a-text value="✧" align="center" color="#ffffff" width="0.85"></a-text></a-entity>
          <a-entity class="starBig" position="-0.65 -1.5 0"><a-text value="✦" align="center" color="#9ee7ff" width="0.85"></a-text></a-entity>
          <a-entity class="starBig" position="1.1 -1.15 0"><a-text value="✧" align="center" color="#ffffff" width="0.75"></a-text></a-entity>
          <a-entity class="starBig" position="-1.25 -0.95 0"><a-text value="✦" align="center" color="#ffe98a" width="0.75"></a-text></a-entity>
        </a-entity>

        <a-entity id="tinyStars">
          <a-text class="tiny" value="·" position="1.1 1.1 0.2" color="#ffffff" width="2"></a-text>
          <a-text class="tiny" value="·" position="-1.2 1.25 0.2" color="#ffffff" width="2"></a-text>
          <a-text class="tiny" value="·" position="1.4 -0.3 0.2" color="#fff6a8" width="2"></a-text>
          <a-text class="tiny" value="·" position="-1.4 -0.4 0.2" color="#ffffff" width="2"></a-text>
          <a-text class="tiny" value="·" position="0.8 1.45 0.2" color="#bdefff" width="2"></a-text>
          <a-text class="tiny" value="·" position="-0.8 1.45 0.2" color="#ffffff" width="2"></a-text>
          <a-text class="tiny" value="·" position="0.2 -1.55 0.2" color="#fff59d" width="2"></a-text>
          <a-text class="tiny" value="·" position="1.55 0.9 0.2" color="#ffffff" width="2"></a-text>
        </a-entity>
      </a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const earth = document.querySelector("#earth");
    const starsInner = document.querySelector("#starsInner");
    const starsOuter = document.querySelector("#starsOuter");
    const stars = document.querySelectorAll(".star");
    const bigStars = document.querySelectorAll(".starBig");
    const tinyStars = document.querySelectorAll(".tiny");
    const speedRange = document.querySelector("#speedRange");
    const speedValue = document.querySelector("#speedValue");
    let speed = 1;
    let angle = 0;
    let lastFrame = 0;

    function setSpeed(value) {
      speed = Math.max(0, Math.min(5, Number(value) || 0));
      speedRange.value = String(speed);
      speedValue.textContent = `ความเร็ว ${speed.toFixed(2)}x`;
    }

    document.querySelector("#slowBtn").addEventListener("click", () => setSpeed(speed - 0.25));
    document.querySelector("#fastBtn").addEventListener("click", () => setSpeed(speed + 0.25));
    speedRange.addEventListener("input", event => setSpeed(event.target.value));

    function animate(now) {
      const delta = lastFrame ? Math.min((now - lastFrame) / 16.67, 3) : 1;
      lastFrame = now;
      const time = now;

      earth.object3D.rotation.y += 0.003 * speed * delta;
      angle += 0.008 * speed * delta;
      starsInner.object3D.rotation.y = angle;
      starsOuter.object3D.rotation.y = -angle * 0.65;

      stars.forEach((star, index) => {
        const scale = 1 + Math.sin(time * 0.006 * speed + index * 1.7) * 0.45;
        star.object3D.scale.setScalar(Math.max(0.05, scale));
        star.object3D.rotation.z = time * 0.001 * speed * (index + 1);
      });

      bigStars.forEach((star, index) => {
        const scale = 1 + Math.sin(time * 0.004 * speed + index * 2.2) * 0.55;
        star.object3D.scale.setScalar(Math.max(0.05, scale));
        star.object3D.rotation.z = -time * 0.0015 * speed;
      });

      tinyStars.forEach((star, index) => {
        const opacity = speed === 0 ? 0.65 : 0.3 + (Math.sin(time * 0.008 * speed + index) + 1) * 0.35;
        star.setAttribute("material", `opacity:${opacity}; transparent:true`);
      });

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);

    const marker = document.querySelector("#hiroMarker");
    marker.addEventListener("markerFound", () => {
      document.querySelector("#info").textContent = "🌍✨ โลกแห่งดวงดาวปรากฏแล้ว!";
    });
    marker.addEventListener("markerLost", () => {
      document.querySelector("#info").textContent = "🌍 ส่องกล้องไปที่ Hiro Marker";
    });
  </script>
</body>
</html>
